
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Japanese Word Match</title>

    <!-- Link to CSS file -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- MAIN MENU -->
        <section id="menu">

            <h1>日本語 Word Match</h1>

            <p>Choose a subject to practise your Japanese!</p>

            <div class="subjects">

                <button onclick="startGame('Food')">
                    🍱 Food
                </button>

                <button onclick="startGame('Numbers')">
                    🔢 Numbers
                </button>

                <button onclick="startGame('Greetings')">
                    👋 Greetings
                </button>

                <button onclick="startGame('People')">
                    👥 People
                </button>

                <button onclick="startGame('Everyday Objects')">
                    🏠 Everyday Objects
                </button>

            </div>

        </section>


        <!-- GAME SCREEN -->
        <section id="game" class="hidden">

            <h1 id="subjectTitle">Food</h1>

            <p>
                Match the Japanese words with their English translations.
            </p>

            <div class="game-info">

                <p>
                    Pairs found:
                    <span id="score">0</span> / 10
                </p>

            </div>

            <div id="gameBoard" class="game-board"></div>

            <p id="message"></p>

            <div class="game-buttons">

                <button onclick="startGame(currentSubject)">
                    Play Again
                </button>

                <button onclick="showMenu()">
                    Main Menu
                </button>

            </div>

        </section>

    </div>


    <!-- Link to JavaScript file -->
    <script src="script.js"></script>

</body>
</html>
